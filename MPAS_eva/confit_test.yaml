dataset:
  files: '/gpfs/f6/bil-fire2-oar/scratch/Huiying.Luo/mpas_plot/jedivar_01/mpasout_pmda_sd.nc'
  gridfile: '/gpfs/f6/bil-fire2-oar/scratch/Huiying.Luo/workflow_260608/rrfs-workflow/fix/conus12km/conus12km.grid.nc'
  vars:
    smoke_fine:
      source: native
      #lev:
      #  - 1
      plot:
        lakes:
          scale: '10m'
          enable: True
          color: 'lightblue'
    precipw:
      source: native
    rainnc:
      source: native
    #refl10cm_1km:
    #  source: native
    #  plot:
    #    colormap: radar_refl

plot:
  # {var} = Variable name
  # {lev} = Variable level
  # {varln} = Variable "long name" (not recommended for filenames since these often contain spaces)
  # {units} = Variable units
  # {filename} = Name of file being read for plotted data
  # {fnme} = Name of file (minus extension) being read for plotted data
  # {date} = The date of plotted data, in %Y-%m-%d format
  # {time} = The time of plotted data, in %H:%M:%S format

  filename: 'testout/{var}_lev{lev}_{date}_{time}_after.png' #output
  title:
    text: 'Plot of {varln}, level {lev} for MPAS forecast, {date} {time}'
    fontsize: 8
  edges:
    #    color: black
    color: face
    # set width to 0 to have no borders
    width: 0.1
  boundaries:
    detail: 0 #1
    scale: '10m'
    color: 'k'
    linewidth: 0.5
  coastlines:
    scale: '10m'
    color: 'k'
    linewidth: 0.2
  colorbar:
    orientation: vertical
    label: 'Units: {units}'
    fontsize: 8
  # Colormap for output from Matplotlib. Reference: https://matplotlib.org/stable/gallery/color/colormap_reference.html
  colormap: "viridis"
  # vmin: 0
  # vmax: 12000
  dpi: 100
  figwidth: 5
  projection:
    projection: PlateCarree
    #latrange: [27.0,55.0]
    #lonrange: [-135.0,-90.0]
